<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App — Rosetta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <a class="back-link" href="/">&larr; Back to Rosetta</a>
    <h1 class="app-name" id="app-display-name">Loading&hellip;</h1>
    <p class="app-meta-line" id="app-meta-line"></p>
  </header>

  <main id="main">
    <nav class="tabs" role="tablist" aria-label="App view">
      <button class="tab-btn active" data-tab="human" type="button" role="tab" aria-selected="true">Human view</button>
      <button class="tab-btn" data-tab="raw" type="button" role="tab" aria-selected="false">Raw JSON</button>
    </nav>

    <section id="tab-human" class="tab-panel active" role="tabpanel">
      <h2>Agent primer</h2>
      <div class="agent-primer" id="agent-primer"></div>

      <h2>Workflow</h2>
      <div class="workflow-block" id="workflow"></div>

      <h2>Shortcuts</h2>
      <ul class="shortcut-list" id="shortcuts"></ul>
    </section>

    <section id="tab-raw" class="tab-panel" role="tabpanel">
      <h2>meta.json</h2>
      <pre><code id="raw-meta"></code></pre>
      <h2>workflow.json</h2>
      <pre><code id="raw-workflow"></code></pre>
      <h2>shortcuts.json</h2>
      <pre><code id="raw-shortcuts"></code></pre>
    </section>
  </main>

  <footer>
    <p>Source: <a href="https://github.com/wesleyshe/Rosetta">github.com/wesleyshe/Rosetta</a> &middot; MIT</p>
  </footer>

  <script>
    // Reliability data is not wired to /lookup in the design pass; all shortcuts
    // render as cold-start ("new"). Wiring to /lookup (which merges live stats
    // into the static spec JSON) is a follow-up substep.
    const params = new URLSearchParams(location.search);
    const appId = params.get("app");

    if (!appId) {
      document.getElementById("app-display-name").textContent = "No app specified";
      const meta = document.getElementById("app-meta-line");
      meta.innerHTML = 'Append <code>?app={app_id}</code> to the URL.';
    } else {
      loadApp(appId);
    }

    async function loadApp(id) {
      const base = "/registry/apps/" + encodeURIComponent(id);
      let meta, workflow, shortcuts;
      try {
        [meta, workflow, shortcuts] = await Promise.all([
          fetchJson(base + "/meta.json"),
          fetchJson(base + "/workflow.json"),
          fetchJson(base + "/shortcuts.json")
        ]);
      } catch (e) {
        document.getElementById("app-display-name").textContent = "App not found";
        document.getElementById("app-meta-line").textContent =
          'Could not load app "' + id + '": ' + e.message;
        return;
      }
      renderApp(meta, workflow, shortcuts);
    }

    async function fetchJson(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
      return r.json();
    }

    function renderApp(meta, workflow, shortcuts) {
      document.title = meta.display_name + " — Rosetta";
      document.getElementById("app-display-name").textContent = meta.display_name;
      const metaParts = [
        meta.id,
        "platforms: " + meta.platforms.join(", ")
      ];
      if (meta.category) metaParts.push(meta.category);
      if (meta.search_first_supported) metaParts.push("search-first ✓");
      document.getElementById("app-meta-line").textContent = metaParts.join(" · ");

      document.getElementById("agent-primer").innerHTML =
        renderSimpleMarkdown(meta.agent_primer || "");

      const wf = document.getElementById("workflow");
      wf.innerHTML = "";
      appendKv(wf, "Default dispatch", workflow.default_dispatch_strategy.join(" → "));
      appendKv(wf, "Default verification", workflow.verification_default);
      appendKv(wf, "Failure recovery", workflow.failure_recovery.join(" → "));

      // Sort: warm shortcuts first by reliability_score desc, cold-start after
      // in document order. v0 has no live stats, so all are cold-start.
      const list = (shortcuts.shortcuts || []).slice().sort((a, b) => {
        const ra = (a.reliability_score == null) ? -1 : a.reliability_score;
        const rb = (b.reliability_score == null) ? -1 : b.reliability_score;
        return rb - ra;
      });

      const ul = document.getElementById("shortcuts");
      ul.innerHTML = "";
      for (const s of list) {
        ul.appendChild(renderShortcutRow(s));
      }

      document.getElementById("raw-meta").textContent = JSON.stringify(meta, null, 2);
      document.getElementById("raw-workflow").textContent = JSON.stringify(workflow, null, 2);
      document.getElementById("raw-shortcuts").textContent = JSON.stringify(shortcuts, null, 2);
    }

    function renderShortcutRow(s) {
      const li = document.createElement("li");
      li.className = "shortcut-row";

      const main = document.createElement("div");
      main.className = "shortcut-main";

      const intent = document.createElement("h3");
      intent.className = "shortcut-intent";
      intent.textContent = s.intent;
      main.appendChild(intent);

      const tags = document.createElement("div");
      tags.className = "shortcut-tags";
      tags.appendChild(makeTag("tag-method", s.method));
      tags.appendChild(makeTag("tag-verify", s.verification.type));
      tags.appendChild(makeTag("tag-platforms", s.platforms.join(", ")));
      main.appendChild(tags);

      const idP = document.createElement("p");
      idP.className = "shortcut-id";
      idP.textContent = s.id;
      main.appendChild(idP);

      const m = s.metadata || {};
      const metaP = document.createElement("p");
      metaP.className = "shortcut-meta";
      const parts = [];
      if (m.token_cost_estimate != null) parts.push("~" + m.token_cost_estimate + " tokens");
      if (m.speed_estimate_ms != null) parts.push("~" + m.speed_estimate_ms + "ms");
      if (m.contributor_id) parts.push(m.contributor_id);
      metaP.textContent = parts.join(" · ");
      main.appendChild(metaP);

      li.appendChild(main);
      li.appendChild(renderReliabilityCell(s));
      return li;
    }

    function renderReliabilityCell(s) {
      const cell = document.createElement("div");
      cell.className = "reliability-cell";

      // Warm path: present when /lookup-merged data lands here. Kept inert in v0
      // since static fetches return no stats.
      if (s.reliability_score != null) {
        const pct = Math.round(s.reliability_score * 100);
        const warm = document.createElement("div");
        warm.className = "reliability-warm";
        const pctSpan = document.createElement("span");
        pctSpan.className = "reliability-pct";
        pctSpan.textContent = pct + "%";
        warm.appendChild(pctSpan);
        const bar = document.createElement("div");
        bar.className = "reliability-bar";
        const fill = document.createElement("div");
        fill.className = "reliability-bar-fill";
        fill.style.width = pct + "%";
        bar.appendChild(fill);
        warm.appendChild(bar);
        cell.appendChild(warm);
        if (s.use_count != null) {
          const n = document.createElement("span");
          n.className = "reliability-n";
          n.textContent = "n=" + s.use_count;
          cell.appendChild(n);
        }
      } else {
        const badge = document.createElement("span");
        badge.className = "badge-new";
        badge.textContent = "New";
        cell.appendChild(badge);
      }
      return cell;
    }

    function makeTag(extraClass, text) {
      const span = document.createElement("span");
      span.className = "tag " + extraClass;
      span.textContent = text;
      return span;
    }

    function appendKv(parent, label, value) {
      const l = document.createElement("div");
      l.className = "workflow-row-label";
      l.textContent = label;
      const v = document.createElement("div");
      v.className = "workflow-row-value";
      v.textContent = value;
      parent.appendChild(l);
      parent.appendChild(v);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    // Tiny markdown renderer for agent_primer. Handles paragraphs, ## / # headings,
    // bullet lists (- ), inline **bold** and `code`. Anything fancier should feed
    // through a real renderer in a later phase.
    function renderSimpleMarkdown(md) {
      const blocks = md.split(/\n\n+/);
      return blocks.map(block => {
        if (block.startsWith("## ")) return "<h3>" + inline(block.slice(3)) + "</h3>";
        if (block.startsWith("# ")) return "<h2>" + inline(block.slice(2)) + "</h2>";
        const lines = block.split("\n");
        if (lines.every(l => l.trim().startsWith("- "))) {
          return "<ul>" + lines.map(l =>
            "<li>" + inline(l.replace(/^\s*-\s*/, "")) + "</li>"
          ).join("") + "</ul>";
        }
        return "<p>" + inline(block.replace(/\n/g, "<br>")) + "</p>";
      }).join("\n");
    }
    function inline(s) {
      return escapeHtml(s)
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => {
          b.classList.remove("active");
          b.setAttribute("aria-selected", "false");
        });
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        btn.setAttribute("aria-selected", "true");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });
  </script>
</body>
</html>
